<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4d3a" />
    <title>open.parlor: family card and board games</title>
    <meta name="description" content="Family card and board games online: Spades, Palace, Hearts, Chess, Go, Backgammon, Yacht and more. Play with family, or against friendly computer players." />
    <!-- Link previews (iMessage, Facebook, Slack, X). __OG_BASE__ becomes the full address: the build writes
         it for GitHub Pages, and the server fills in its own address when it sends the page. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__OG_BASE__" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="open.parlor" />
    <meta property="og:title" content="open.parlor: family card and board games" />
    <meta property="og:description" content="Family card and board games online: Spades, Palace, Hearts, Chess, Go, Backgammon, Yacht and more. Play with family, or against friendly computer players." />
    <meta property="og:image" content="__OG_BASE__og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="open.parlor: playing cards, a checkers board and dice on green felt, with some of the games listed" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="open.parlor: family card and board games" />
    <meta name="twitter:description" content="Family card and board games online: Spades, Palace, Hearts, Chess, Go, Backgammon, Yacht and more. Play with family, or against friendly computer players." />
    <meta name="twitter:image" content="__OG_BASE__og.jpg" />
    <link rel="canonical" href="__OG_BASE__" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="open.parlor" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The no-JavaScript landing zone (below, in the body). The app draws everything in the browser, so
         without a script #root stays empty: hide it, and let the page scroll, so what is written for
         that browser is the page. These rules apply only where scripts are off. "html body" outranks
         styles.css's `html, body, #root { height: 100% }`, which comes later in the head. -->
    <noscript>
      <style>
        #root { display: none; }
        html body { height: auto; min-height: 100%; }
        .nojs { box-sizing: border-box; min-height: 100vh; display: grid; place-content: center; gap: 1rem; max-width: 34rem; margin: 0 auto; padding: 2rem 1.25rem; text-align: center; line-height: 1.5; color: var(--cream, #fbf6ec); }
        .nojs .suits { font-size: 1.6rem; letter-spacing: 0.4rem; color: var(--gold, #e8c46a); }
        .nojs h1 { margin: 0; font-size: 1.9rem; }
        .nojs p { margin: 0; }
        .nojs a { color: var(--gold, #e8c46a); }
        .nojs .works { padding: 0.9rem 1rem; border-radius: var(--radius, 12px); background: rgba(0, 0, 0, 0.22); }
        .nojs small { opacity: 0.75; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only where JavaScript is off (a browser with scripts reads this as text and draws nothing).
         The server swaps the marker below for links to its own pages that need no script, /games and
         /daily (packages/server/src/nojs.ts); a copy published as plain files (GitHub Pages) leaves it
         as the comment it is, since those pages aren't there. -->
    <noscript>
      <main class="nojs">
        <div class="suits" aria-hidden="true">♠ ♥ ♣ ♦</div>
        <h1>The games need JavaScript</h1>
        <p>open.parlor deals its cards, boards and dice in your browser, and JavaScript is off in this one, so nothing can be played here yet.</p>
        <p>Switch JavaScript on for this site in your browser's settings, then reload. It's free, with no sign-up.</p>
        <!--parlor:server-pages-->
        <small>Spades, Hearts, Chess and every other game need it. A browser that can't run JavaScript at all won't be able to play them.</small>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
