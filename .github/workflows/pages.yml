name: Deploy table to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The web app imports the Mini Golf course package from its build.
      - run: npm run build -w @open-parlor/courses
      - run: npm run build -w @open-parlor/web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      # The card designer goes along, under designer/. Without a server behind it, decks stay in
      # the browser; choosing one still dresses the practice tables.
      - run: npm run build -w @open-parlor/designer && cp -r packages/designer/dist packages/web/dist/designer
        env:
          BASE_PATH: /${{ github.event.repository.name }}/designer/
      # So the front page's "Watch a game" link lands somewhere: without a server the page says so.
      - run: npm run build -w @open-parlor/watch && cp -r packages/watch/dist packages/web/dist/watch
        env:
          BASE_PATH: /${{ github.event.repository.name }}/watch/
      # The WebAssembly games go along, under wasm/. The page and the game's data (which is in the
      # repository) are all it needs, so it plays without a server.
      - run: npm run build -w @open-parlor/wasm && cp -r packages/wasm/dist packages/web/dist/wasm
        env:
          BASE_PATH: /${{ github.event.repository.name }}/wasm/
      # How the parlor is built, under conformance/: the same Zubra components in every framework,
      # the checks run against them here in the runner's Chrome, and a page of how they went. A
      # failing check doesn't stop the parlor being published; the page says what failed.
      - run: npm run build -w @open-parlor/conformance
      # Chrome is on the runner; Firefox and WebKit are Playwright's own builds.
      - run: npx playwright install --with-deps firefox webkit
        working-directory: packages/conformance
      - run: npm run conformance:engines -w @open-parlor/conformance
        continue-on-error: true
      - run: cp -r packages/conformance/dist packages/web/dist/conformance
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
