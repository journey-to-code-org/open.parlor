name: CI
on:
  push:
    branches: [main, "staging/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Building writes the components' typings (*.d.zb.ts) and the packages the server imports,
      # so typecheck after it.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # The same Zubra components in every framework, checked in Chrome, Firefox and WebKit.
      - run: npm run build -w @open-parlor/conformance
      # Chrome is on the runner; Firefox and WebKit are Playwright's own builds.
      - run: npx playwright install --with-deps firefox webkit
        working-directory: packages/conformance
      - run: npm run conformance:engines -w @open-parlor/conformance
      # The page the server draws itself (/games), in a browser with JavaScript off and on.
      - run: npm run server-page:engines -w @open-parlor/conformance
      # Tests run through vitest, which forgives some Node ESM import mistakes; boot the real build.
      - name: Smoke test the built server
        run: |
          PORT=8790 CARDROOM_DB=:memory: node packages/server/dist/index.js &
          for i in $(seq 1 20); do curl -fs localhost:8790/healthz && break; sleep 0.5; done
          curl -fs localhost:8790/push/key
          curl -fs localhost:8790/ | grep -q manifest.webmanifest
          # The designer and the admin app are served under the parlor's address.
          curl -fs localhost:8790/designer/ | grep -q "Card designer"
          curl -fs localhost:8790/admin/ | grep -q "open.parlor admin"
          curl -fs localhost:8790/watch/ | grep -q "Watch a game"
          # The WebAssembly games: the page, and the engine served as WebAssembly.
          curl -fs localhost:8790/wasm/ | grep -q "Freedoom"
          curl -fsI "localhost:8790/wasm/assets/$(basename packages/wasm/dist/assets/shooter-*.wasm)" | grep -qi "content-type: application/wasm"
          # The rooms that let devices play the WebAssembly games together: listed, and opened.
          curl -fs localhost:8790/wasm/play | grep -q '"games"'
          curl -fs -X POST localhost:8790/wasm/play | grep -q '"code"'
          curl -fs localhost:8790/catalogue | grep -q '"spades"'
          curl -fs localhost:8790/spectate | grep -q '"tables"'
          curl -fs localhost:8790/designs | grep -q '"designs"'
          # Without CARDROOM_ADMIN_TOKEN, moderation is off.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8790/moderation/overview)" = 503
      # Computer players think in worker threads. The built server has to find its worker file, and
      # a bot has to get its moves out of a worker: Checkers and Mini Golf, played over HTTP.
      - name: Smoke test the bot workers
        run: |
          PORT=8791 CARDROOM_DB=:memory: CARDROOM_BOT_DELAY=50 node packages/server/dist/index.js &
          for i in $(seq 1 20); do curl -fs localhost:8791/healthz && break; sleep 0.5; done
          node packages/server/scripts/smoke-bots.mjs http://localhost:8791
